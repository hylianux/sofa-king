<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
  <title>Controls</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { background: transparent; }
    body { display: grid; place-items: center; }

    .bar {
      display: flex;
      align-items: center;
      gap: 1.3rem;
      padding: 0.55rem 1.3rem;
      border-radius: 999px;
      background: rgba(11, 11, 16, 0.82);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      color: #dcd9e4;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .bar span { display: inline-flex; align-items: center; gap: 0.5rem; }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 1.9em;
      height: 1.7em;
      padding: 0 0.45em;
      border-radius: 0.45em;
      background: #2f2e3b;
      color: #fff;
      font: 700 0.8em system-ui, sans-serif;
    }

    kbd.stick { border-radius: 999px; }
  </style>
</head>
<body>
  <div class="bar">
    <span><kbd class="stick">R</kbd>Pointer</span>
    <span><kbd data-bind="lclick"></kbd>Click</span>
    <span><kbd data-bind="rclick"></kbd>Right-click</span>
    <span><kbd data-bind="scrollup"></kbd><kbd data-bind="scrolldown"></kbd>Scroll</span>
    <span><kbd data-bind="keyboard"></kbd>Keyboard</span>
    <span><kbd data-bind="esc"></kbd>Esc</span>
    <span><kbd data-bind="back"></kbd>Back</span>
    <span><kbd data-bind="menu"></kbd>Menu</span>
  </div>
  <script src="bindings.js"></script>
  <script src="sounds.js"></script>
</body>
</html>
