<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SOFA King's icon: a sofa in front of a glowing screen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22212e"/><stop offset="1" stop-color="#0f0f15"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#b54bd6"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#d9482b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="96" y="78" width="320" height="180" rx="22" fill="url(#screen)" opacity="0.95"/>
  <rect x="226" y="258" width="60" height="22" fill="#3a3948"/>
  <!-- the sofa: back, seat, arms, feet -->
  <rect x="122" y="292" width="268" height="78" rx="30" fill="url(#sofa)"/>
  <rect x="108" y="352" width="296" height="62" rx="22" fill="#e85a3a"/>
  <rect x="76" y="318" width="70" height="112" rx="30" fill="url(#sofa)"/>
  <rect x="366" y="318" width="70" height="112" rx="30" fill="url(#sofa)"/>
  <rect x="104" y="428" width="22" height="26" rx="6" fill="#3a3948"/>
  <rect x="386" y="428" width="22" height="26" rx="6" fill="#3a3948"/>
</svg>
