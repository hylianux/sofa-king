# Builds SOFA King's AppImage and publishes a release on GitHub.
#
# To make a release: set "version" in package.json, then push a tag of that version:
#   git tag v0.2.0 && git push origin v0.2.0
# A tag with a dash (v0.2.0-beta.1) makes a pre-release, which "latest stable" skips.
#
# "Run workflow" on the Actions tab builds the AppImage without releasing it (to try a build):
# it's kept for a week under that run's Artifacts.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # The tag and package.json must agree, so the file name and the app say the same version.
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::The tag says $want but package.json says $have. Change one to match."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build the AppImage
        run: npm run dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          retention-days: 7

  release:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          file="$(cd dist && ls *.AppImage)"
          cat > notes.md <<NOTES
          ## Installing

          1. Download **${file}** below.
          2. Make it runnable: right-click it → Properties → Permissions → "Is executable", or run \`chmod +x ${file}\`.
          3. Double-click it, or run \`./${file}\`.

          For films, shows and music it uses **mpv**, so install that too (\`sudo pacman -S mpv\`, \`sudo apt install mpv\`, \`sudo dnf install mpv\`). Everything else is optional; the README explains what each part needs.

          \`SHA256SUMS.txt\` lets you check the download: \`sha256sum -c SHA256SUMS.txt\`. *Source code* is the app as it was for this release.

          NOTES
          gh release create "$tag" dist/*.AppImage dist/SHA256SUMS.txt \
            --title "SOFA King ${tag#v}" --notes-file notes.md --generate-notes --verify-tag $pre
